name: Deploy Colour Atlas to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'data/figure-assets/**'
      - 'pipeline/restore_assets.py'
      - 'pipeline/validate_release.py'
      - 'tests/**'
      - 'research/seed-palettes.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Restore reviewed figure assets
        run: python pipeline/restore_assets.py
      - name: Validate static site
        run: |
          node --check dist/app.js
          python -m pip install Pillow
          python pipeline/validate_release.py --expected-count 500
          node tests/frontend-scale.cjs --require-release
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
